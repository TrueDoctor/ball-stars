[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"
pollster = "1.0"
bitcode = "0.6.9"
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "std"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland"] }

fetch.workspace = true
engine.workspace = true
nalgebra = "0.35.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
